name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
concurrency:
  group: build-${{{ github.ref }}}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
